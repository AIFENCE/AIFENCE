name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  python:
    name: Python release gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install complete Python surface
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,mcp,otel,s3,bench,quality,redis,kafka,rabbitmq]"
          pip install build pip-audit
      - name: Lint
        run: ruff check src tests scripts
      - name: Type-check
        run: mypy src
      - name: Tests with enforced coverage
        run: pytest --cov=aifence --cov-report=term-missing --cov-fail-under=80
      - name: Product conformance
        run: pytest tests/conformance
      - name: Adversarial evaluation
        run: aifence-redteam --behavioral --max-false-positive-rate 0 --min-detection-rate 100
      - name: Repository security and architecture gates
        run: |
          python scripts/security_check.py
          python scripts/architecture_check.py
          python scripts/invariant_check.py
          python scripts/quality_registry_check.py
          python scripts/protocol_fixture_check.py
          python scripts/release_check.py
      - name: Python dependency vulnerability audit
        run: pip-audit --strict
      - name: Generate Python SBOM
        run: python scripts/generate_sbom.py --output dist/aifence-python-sbom.cdx.json
      - uses: actions/upload-artifact@v4
        with:
          name: python-sbom
          path: dist/aifence-python-sbom.cdx.json

  quality:
    name: Quality 2.0 deterministic build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install validator dependencies
        run: pip install -r quality/source/requirements.txt
      - name: Build, verify and test canonical Quality source
        working-directory: quality
        run: |
          npm run clean
          npm run build
          npm run verify
          npm test

  ecosystems:
    name: SDKs, adapters and Bus TCK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
      - name: Python SDK
        working-directory: sdks/python
        run: |
          python -m pip install --upgrade pip
          pip install .
          python -m compileall -q aifence_client
          python -c "from aifence_client import AifenceClient, AsyncAifenceClient; assert AifenceClient and AsyncAifenceClient"
      - name: TypeScript SDK
        working-directory: sdks/typescript
        run: |
          npm ci
          npm test
      - name: Go SDK
        working-directory: sdks/go
        run: go test ./...
      - name: OpenClaw adapter
        working-directory: integrations/openclaw
        run: |
          npm install --ignore-scripts
          npm run build
          node dist/conformance.js ../../src/aifence/bus/tck/vectors/core.json
      - name: Install AIFENCE runtime for Bus TCK
        run: pip install -e .
      - name: Python Bus TCK and mutation suite
        run: python -m aifence.bus.conformance --json --fuzz 200
      - name: Cross-implementation conformance matrix
        run: python scripts/conformance_matrix.py

  package:
    name: Built-artifact certification
    needs: [python, quality, ecosystems]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build reproducible release artifacts
        run: |
          python -m pip install --upgrade pip
          pip install build wheel setuptools
          python scripts/build_release.py --output dist
          python scripts/package_check.py \
            --source dist/aifence-v0.1.0-source.zip \
            --wheel "$(find dist -maxdepth 1 -name 'aifence-0.1.0-*.whl' -print -quit)"
      - name: Clean-wheel smoke and fence demo
        run: |
          python -m venv /tmp/aifence-wheel-smoke
          /tmp/aifence-wheel-smoke/bin/pip install "$(find dist -maxdepth 1 -name 'aifence-0.1.0-*.whl' -print -quit)"
          /tmp/aifence-wheel-smoke/bin/aifence doctor --json
          /tmp/aifence-wheel-smoke/bin/aifence demo
      - uses: actions/upload-artifact@v4
        with:
          name: aifence-release-candidate
          path: |
            dist/*.whl
            dist/*source.zip
            dist/*SHA256SUMS.txt
