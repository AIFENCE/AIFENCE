name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    name: Python tiers (core + guard + bus + quality)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,mcp,otel,s3,bench]"
      - name: Lint
        run: ruff check src tests
      - name: Type-check
        run: mypy src
      - name: Test
        run: pytest
      - name: Adversarial evaluation
        # Regression gate on the measured result: benign work must never be
        # hard-refused, and detection must not fall below the recorded baseline.
        run: |
          aifence-redteam --behavioral --max-false-positive-rate 0 --min-detection-rate 100

  quality:
    name: Quality subsystem (BizIQ build + validate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build & validate BizIQ pack
        working-directory: quality
        run: |
          npm ci
          npm run build
          npm test
