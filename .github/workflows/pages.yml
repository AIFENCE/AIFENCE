name: Documentation

on:
  push:
    branches: [main]
    paths:
      - "docs/**"
      - "tooling/build-wiki.mjs"
      - "tooling/wiki.css"
      - "tooling/check-wiki-links.mjs"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

# Allow one concurrent deployment; a newer commit supersedes a queued one.
concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Configure Pages
        # Required before uploading a Pages artifact; also enables Pages on the
        # repository when it has not been turned on manually.
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Build the documentation site
        run: node tooling/build-wiki.mjs
      - name: Check for broken internal links
        run: node tooling/check-wiki-links.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
