name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build:
    name: Build and certify release artifacts
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: read
      id-token: write
      attestations: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { fetch-depth: 0 }
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with: { python-version: "3.12", cache: pip }

      - name: Resolve and validate release version
        id: version
        env:
          RELEASE_REF_TYPE: ${{ github.ref_type }}
          RELEASE_REF_NAME: ${{ github.ref_name }}
        run: python scripts/release_preflight.py --ref-type "$RELEASE_REF_TYPE" --ref-name "$RELEASE_REF_NAME" --github-output "$GITHUB_OUTPUT"

      - name: Require successful CI for tagged releases
        if: steps.version.outputs.publish == 'true'
        env: { GH_TOKEN: "${{ github.token }}" }
        shell: bash
        run: |
          set -euo pipefail
          gh api -H "Accept: application/vnd.github+json" "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" > /tmp/checks.json
          python - <<'PY'
          import json
          from pathlib import Path
          required={"Python release gate","Quality 2.0 deterministic build","SDKs, adapters and Bus TCK","Built-artifact certification"}
          runs=json.loads(Path('/tmp/checks.json').read_text())['check_runs']; latest={}
          for r in runs:
              if r.get('name') in required:
                  stamp=r.get('completed_at') or r.get('started_at') or ''
                  if r['name'] not in latest or stamp>latest[r['name']][0]: latest[r['name']]=(stamp,r.get('status'),r.get('conclusion'),r.get('html_url'))
          missing=required-set(latest); failed={n:v for n,v in latest.items() if v[1]!='completed' or v[2]!='success'}
          if missing or failed:
              print('missing:',sorted(missing)); print('failed:',failed); raise SystemExit('Tagged commit is not fully certified by CI')
          print('All required CI checks succeeded.')
          PY

      - name: Install release tooling and runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,mcp,otel,s3,bench,quality,redis,kafka,rabbitmq]"
          pip install build wheel setuptools pip-audit

      - name: Release line + branch coverage profile
        run: |
          pytest --cov=aifence --cov-branch --cov-report=term-missing --cov-report=json:coverage-release.json --cov-fail-under=0
          python scripts/coverage_policy.py --profile release --coverage-json coverage-release.json

      - name: Release consistency and security gates
        run: |
          ruff check src tests scripts
          mypy src
          python scripts/security_check.py
          python scripts/secret_scan.py
          python scripts/security_regression_check.py
          python scripts/architecture_check.py
          python scripts/invariant_check.py
          python scripts/quality_registry_check.py
          python scripts/protocol_fixture_check.py
          python scripts/api_compat_check.py
          python scripts/release_check.py
          pip-audit --strict

      - name: Build reproducibly twice
        shell: bash
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          python scripts/reproducibility_check.py --source-date-epoch "$SOURCE_DATE_EPOCH"
          rm -rf dist
          python scripts/build_release.py --output dist

      - name: Validate built artifacts and clean-wheel behavior
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          WHEEL="$(find dist -maxdepth 1 -name "aifence-${VERSION}-*.whl" -print -quit)"
          python scripts/package_check.py --source "dist/aifence-v${VERSION}-source.zip" --wheel "$WHEEL"
          python -m venv /tmp/aifence-release-smoke
          /tmp/aifence-release-smoke/bin/pip install --upgrade pip
          /tmp/aifence-release-smoke/bin/pip install "$WHEEL"
          /tmp/aifence-release-smoke/bin/aifence doctor --json
          /tmp/aifence-release-smoke/bin/aifence demo
          /tmp/aifence-release-smoke/bin/python scripts/generate_sbom.py --output dist/aifence-python-sbom.cdx.json
          sha256sum dist/aifence-python-sbom.cdx.json >> "dist/AIFENCE-v${VERSION}-SHA256SUMS.txt"
          sort -k2 -o "dist/AIFENCE-v${VERSION}-SHA256SUMS.txt" "dist/AIFENCE-v${VERSION}-SHA256SUMS.txt"

      - name: Attest release artifacts
        if: steps.version.outputs.publish == 'true'
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # pinned v3 line
        with:
          subject-path: |
            dist/*.whl
            dist/*source.zip
            dist/*SHA256SUMS.txt
            dist/*sbom*.json

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: aifence-v${{ steps.version.outputs.version }}-release-assets
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.whl
            dist/*source.zip
            dist/*SHA256SUMS.txt
            dist/*sbom*.json

  publish:
    name: Publish GitHub Release and GHCR image
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Download certified assets from this run
        env: { GH_TOKEN: "${{ github.token }}" }
        run: gh run download "$GITHUB_RUN_ID" -n "aifence-v${{ needs.build.outputs.version }}-release-assets" -D dist

      - name: Build container for scan
        env:
          VERSION: ${{ needs.build.outputs.version }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/aifence
        run: |
          IMAGE="${IMAGE,,}"
          docker build --pull -t "$IMAGE:$VERSION" .
          echo "IMAGE=$IMAGE" >> "$GITHUB_ENV"

      - name: Scan final container
        uses: aquasecurity/trivy-action@57a97c7e7821a5776cebc9bb87c984fa69cba8f1 # v0.35.0 / Trivy 0.69.3 safe pin
        with:
          image-ref: ${{ env.IMAGE }}:${{ needs.build.outputs.version }}
          format: table
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"
          version: v0.69.3

      - name: Push GHCR image
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          echo "$GH_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
          docker tag "$IMAGE:$VERSION" "$IMAGE:${VERSION%.*}"
          docker tag "$IMAGE:$VERSION" "$IMAGE:latest"
          docker push "$IMAGE:$VERSION"
          docker push "$IMAGE:${VERSION%.*}"
          docker push "$IMAGE:latest"
          docker pull "$IMAGE:$VERSION" >/dev/null
          DIGEST="$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$VERSION" | sed 's/.*@//')"
          test -n "$DIGEST"
          echo "IMAGE_DIGEST=$DIGEST" >> "$GITHUB_ENV"

      - name: Attest container provenance
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # pinned v3 line
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ env.IMAGE_DIGEST }}
          push-to-registry: true

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PRERELEASE=()
          if [[ "$VERSION" == *-* || "$VERSION" == *rc* || "$VERSION" == *a* || "$VERSION" == *b* ]]; then PRERELEASE=(--prerelease); fi
          gh release create "$TAG" dist/* --verify-tag --draft --generate-notes --title "AIFENCE $TAG" "${PRERELEASE[@]}"
