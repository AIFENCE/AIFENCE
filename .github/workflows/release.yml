name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read
  checks: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build and certify release artifacts
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      publish: ${{ steps.version.outputs.publish }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Resolve and validate release version
        id: version
        shell: bash
        run: |
          set -euo pipefail
          VERSION="$(python - <<'PY'
          import tomllib
          from pathlib import Path
          print(tomllib.loads(Path('pyproject.toml').read_text(encoding='utf-8'))['project']['version'])
          PY
          )"
          EXPECTED_TAG="v${VERSION}"
          PUBLISH=false
          TAG=""
          if [[ "${GITHUB_REF_TYPE}" == "tag" ]]; then
            TAG="${GITHUB_REF_NAME}"
            if [[ "${TAG}" != "${EXPECTED_TAG}" ]]; then
              echo "Release tag ${TAG} does not match pyproject.toml version ${EXPECTED_TAG}." >&2
              exit 1
            fi
            PUBLISH=true
          fi
          echo "version=${VERSION}" >> "${GITHUB_OUTPUT}"
          echo "tag=${TAG}" >> "${GITHUB_OUTPUT}"
          echo "publish=${PUBLISH}" >> "${GITHUB_OUTPUT}"
          echo "Resolved AIFENCE ${VERSION}; publish=${PUBLISH}"

      - name: Require successful CI for tagged releases
        if: steps.version.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api \
            -H "Accept: application/vnd.github+json" \
            "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/check-runs?per_page=100" \
            > /tmp/aifence-check-runs.json
          python - <<'PY'
          import json
          from pathlib import Path

          required = {
              "Python release gate",
              "Quality 2.0 deterministic build",
              "SDKs, adapters and Bus TCK",
              "Built-artifact certification",
          }
          payload = json.loads(Path("/tmp/aifence-check-runs.json").read_text(encoding="utf-8"))
          latest = {}
          for run in payload.get("check_runs", []):
              name = run.get("name")
              if name not in required:
                  continue
              stamp = run.get("completed_at") or run.get("started_at") or ""
              if name not in latest or stamp > latest[name][0]:
                  latest[name] = (stamp, run.get("status"), run.get("conclusion"), run.get("html_url"))

          missing = sorted(required - latest.keys())
          failed = {
              name: values
              for name, values in latest.items()
              if values[1] != "completed" or values[2] != "success"
          }
          if missing or failed:
              if missing:
                  print("Missing required CI checks:", ", ".join(missing))
              for name, (_, status, conclusion, url) in failed.items():
                  print(f"{name}: status={status} conclusion={conclusion} {url or ''}")
              raise SystemExit("Tagged commit is not fully certified by CI")
          print("All required CI checks succeeded for the tagged commit.")
          PY

      - name: Install release tooling and runtime
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,postgres,mcp,otel,s3,bench,quality,redis,kafka,rabbitmq]"
          pip install build wheel setuptools pip-audit

      - name: Release consistency and vulnerability gates
        run: |
          ruff check src tests scripts
          mypy src
          python scripts/security_check.py
          python scripts/architecture_check.py
          python scripts/invariant_check.py
          python scripts/quality_registry_check.py
          python scripts/protocol_fixture_check.py
          python scripts/release_check.py
          pip-audit --strict

      - name: Build reproducible source and wheel
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct "${GITHUB_SHA}")"
          python scripts/build_release.py --output dist

      - name: Validate built artifacts
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          WHEEL="$(find dist -maxdepth 1 -name "aifence-${VERSION}-*.whl" -print -quit)"
          test -n "${WHEEL}"
          python scripts/package_check.py \
            --source "dist/aifence-v${VERSION}-source.zip" \
            --wheel "${WHEEL}"

      - name: Clean-wheel smoke test
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          WHEEL="$(find dist -maxdepth 1 -name "aifence-${VERSION}-*.whl" -print -quit)"
          python -m venv /tmp/aifence-release-smoke
          /tmp/aifence-release-smoke/bin/pip install --upgrade pip
          /tmp/aifence-release-smoke/bin/pip install "${WHEEL}"
          /tmp/aifence-release-smoke/bin/aifence doctor --json
          /tmp/aifence-release-smoke/bin/aifence demo
          /tmp/aifence-release-smoke/bin/python scripts/generate_sbom.py \
            --output dist/aifence-python-sbom.cdx.json

      - name: Finalize release checksums
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          CHECKSUMS="dist/AIFENCE-v${VERSION}-SHA256SUMS.txt"
          SBOM="dist/aifence-python-sbom.cdx.json"
          sha256sum "${SBOM}" >> "${CHECKSUMS}"
          sort -k2 -o "${CHECKSUMS}" "${CHECKSUMS}"
          cat "${CHECKSUMS}"

      - name: Upload certified build artifact
        uses: actions/upload-artifact@v4
        with:
          name: aifence-v${{ steps.version.outputs.version }}-release-assets
          if-no-files-found: error
          retention-days: 30
          path: |
            dist/*.whl
            dist/*source.zip
            dist/*SHA256SUMS.txt
            dist/*sbom*.json

  publish:
    name: Create GitHub Release
    if: needs.build.outputs.publish == 'true'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: aifence-v${{ needs.build.outputs.version }}-release-assets
          path: dist

      - name: Create draft GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.build.outputs.tag }}
          VERSION: ${{ needs.build.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          PRERELEASE=()
          if [[ "${VERSION}" == *-* || "${VERSION}" == *rc* || "${VERSION}" == *a* || "${VERSION}" == *b* ]]; then
            PRERELEASE=(--prerelease)
          fi
          gh release create "${TAG}" dist/* \
            --verify-tag \
            --draft \
            --generate-notes \
            --title "AIFENCE ${TAG}" \
            "${PRERELEASE[@]}"
