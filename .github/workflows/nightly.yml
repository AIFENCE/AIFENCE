name: Nightly deep assurance

on:
  schedule:
    - cron: "41 4 * * *"
  workflow_dispatch:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  deep-python:
    name: Nightly coverage, properties, chaos and mutation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
          cache: pip
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with: { node-version: "24" }
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with: { go-version: "1.24", cache: false }
      - run: |
          pip install -e ".[dev,hardening,postgres,mcp,otel,s3,bench,quality,redis,kafka,rabbitmq]"
          pip install pip-audit
      - name: Deep line/branch coverage profile
        run: |
          pytest --cov=aifence --cov-branch --cov-report=json:coverage.json
          python scripts/coverage_policy.py --profile nightly --coverage-json coverage.json
      - name: Build cross-language conformance adapters
        working-directory: integrations/openclaw
        run: |
          npm install --ignore-scripts
          npm run build
      - name: Property, fuzz and chaos regressions
        run: |
          pytest tests/bus/test_protocol_properties_hypothesis.py tests/conformance/test_failure_injection.py
          python -m aifence.bus.conformance --json --fuzz 5000
          python scripts/differential_fuzz.py --iterations 1000
          python scripts/chaos_suite.py --messages 128
      - name: Targeted mutation test
        run: mutmut run
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: nightly-python-assurance
          path: |
            coverage.json
            mutants/
          if-no-files-found: ignore

  benchmark:
    name: Nightly performance regression
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,bench]"
      - run: |
          python scripts/benchmark_fence.py --iterations 200 --warmup 20 --output dist/fence-benchmark.json --max-p95-ms 500
          python scripts/performance_check.py
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nightly-benchmarks
          path: dist/fence-benchmark.json
