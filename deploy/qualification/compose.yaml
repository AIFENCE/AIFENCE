name: agentdance-qualification
services:
  postgres:
    image: postgres:18.4-bookworm
    environment:
      POSTGRES_DB: agentdance
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: qualification-admin
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d agentdance"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - postgres:/var/lib/postgresql

  minio:
    image: quay.io/minio/minio:RELEASE.2025-07-23T15-54-02Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: agentdance
      MINIO_ROOT_PASSWORD: qualification-secret-change-me
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 30
    volumes:
      - minio:/data

  create-bucket:
    image: quay.io/minio/mc:RELEASE.2025-07-21T05-28-08Z
    depends_on:
      minio:
        condition: service_healthy
    entrypoint:
      - /bin/sh
      - -ec
      - |
        mc alias set local http://minio:9000 agentdance qualification-secret-change-me
        mc mb --ignore-existing local/agentdance-artifacts
        mc version enable local/agentdance-artifacts
        mc retention set --default governance 1d local/agentdance-artifacts || true

  clamav:
    image: clamav/clamav:1.4.5-debian@sha256:0542880c8abebb7430be5366657aec561f03693ed7be4e64a45fd2ee60b08d02
    user: clamav
    entrypoint: ["/init-unprivileged"]
    healthcheck:
      test: ["CMD", "/usr/local/bin/clamdcheck.sh"]
      interval: 20s
      timeout: 10s
      retries: 30
    volumes:
      - clamav:/var/lib/clamav

  egress-proxy:
    image: mitmproxy/mitmproxy:12.1.1
    command: ["mitmdump", "--mode", "regular", "--listen-host", "0.0.0.0", "--listen-port", "8080", "--set", "block_global=false"]
    read_only: true
    tmpfs:
      - /home/mitmproxy/.mitmproxy:size=32m,mode=700
      - /tmp:size=32m,mode=1777

  init-db-roles:
    image: postgres:18.4-bookworm
    environment:
      PGPASSWORD: qualification-admin
    depends_on:
      postgres:
        condition: service_healthy
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d agentdance <<'SQL'
        SELECT 'CREATE ROLE agentdance_app LOGIN PASSWORD ''qualification-only'''
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'agentdance_app')\gexec
        SELECT 'CREATE ROLE agentdance_dispatcher LOGIN PASSWORD ''dispatcher-only'''
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'agentdance_dispatcher')\gexec
        SELECT 'CREATE ROLE agentdance_lifecycle LOGIN PASSWORD ''lifecycle-only'''
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'agentdance_lifecycle')\gexec
        SELECT 'CREATE ROLE agentdance_anchor LOGIN PASSWORD ''anchor-only'''
          WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'agentdance_anchor')\gexec
        SQL

  migrate:
    build:
      context: ../..
    command: ["migrate"]
    environment:
      AGENTDANCE_ENVIRONMENT: staging
      AGENTDANCE_DATABASE_URL: postgresql+psycopg://postgres:qualification-admin@postgres:5432/agentdance
      AGENTDANCE_AUTO_CREATE_SCHEMA: "false"
    depends_on:
      init-db-roles:
        condition: service_completed_successfully

  agentdance:
    build:
      context: ../..
    command: ["serve", "--workers", "1"]
    environment: &runtime
      AGENTDANCE_ENVIRONMENT: staging
      AGENTDANCE_PUBLIC_BASE_URL: https://agentdance:8080
      AGENTDANCE_SOURCE_CODE_URL: https://github.com/AIFENCE/AIFENCE/tree/v1.0.0-rc.5
      AGENTDANCE_COMMERCIAL_LICENSE_URL: https://github.com/AIFENCE/AIFENCE/blob/main/COMMERCIAL-LICENSE.md
      AGENTDANCE_DATABASE_URL: postgresql+psycopg://agentdance_app:qualification-only@postgres:5432/agentdance
      AGENTDANCE_RUNTIME_ROLE: control-plane
      AGENTDANCE_AUTO_CREATE_SCHEMA: "false"
      AGENTDANCE_SIGNING_PRIVATE_KEY_FILE: /run/agentdance/signing-private.pem
      AGENTDANCE_SIGNING_PUBLIC_KEY_FILE: /run/agentdance/signing-public.pem
      AGENTDANCE_MASTER_KEY_B64_FILE: /run/agentdance/master-key.b64
      AGENTDANCE_API_KEY_PEPPER_FILE: /run/agentdance/api-key-pepper
      AGENTDANCE_TLS_CERT_FILE: /run/agentdance/tls.crt
      AGENTDANCE_TLS_KEY_FILE: /run/agentdance/tls.key
      AGENTDANCE_CLAMAV_HOST: clamav
      AGENTDANCE_CLAMAV_REQUIRED: "true"
      AGENTDANCE_DISPATCH_MODE: async
      AGENTDANCE_ARTIFACT_STORE_BACKEND: s3
      AGENTDANCE_ARTIFACT_S3_ENDPOINT: http://minio:9000
      AGENTDANCE_ARTIFACT_S3_BUCKET: agentdance-artifacts
      AGENTDANCE_ARTIFACT_S3_ACCESS_KEY: agentdance
      AGENTDANCE_ARTIFACT_S3_SECRET_KEY: qualification-secret-change-me
      AGENTDANCE_AUDIT_ANCHOR_BACKEND: file
      AGENTDANCE_AUDIT_ANCHOR_DIRECTORY: /evidence/anchors
      AGENTDANCE_EGRESS_PROXY_URL: http://egress-proxy:8080
      AGENTDANCE_PROVIDER_ALLOWED_HOSTS: api.openai.com,api.anthropic.com,generativelanguage.googleapis.com
      AGENTDANCE_TOOL_ALLOWED_HOSTS: api.openai.com
      AGENTDANCE_OTEL_SERVICE_NAME: agentdance-qualification
      AGENTDANCE_DOCS_ENABLED: "true"
    deploy:
      replicas: 3
    depends_on:
      migrate:
        condition: service_completed_successfully
      create-bucket:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ../../secrets:/run/agentdance:ro
      - evidence:/evidence
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  worker:
    build:
      context: ../..
    command: ["worker"]
    environment:
      <<: *runtime
      AGENTDANCE_DATABASE_URL: postgresql+psycopg://agentdance_dispatcher:dispatcher-only@postgres:5432/agentdance
      AGENTDANCE_RUNTIME_ROLE: dispatcher
    deploy:
      replicas: 3
    restart: on-failure
    depends_on:
      agentdance:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ../../secrets:/run/agentdance:ro
      - evidence:/evidence
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  lifecycle-worker:
    build:
      context: ../..
    command: ["lifecycle-worker"]
    environment:
      <<: *runtime
      AGENTDANCE_DATABASE_URL: postgresql+psycopg://agentdance_lifecycle:lifecycle-only@postgres:5432/agentdance
      AGENTDANCE_RUNTIME_ROLE: lifecycle
    deploy:
      replicas: 2
    restart: on-failure
    depends_on:
      agentdance:
        condition: service_started
      create-bucket:
        condition: service_completed_successfully
      clamav:
        condition: service_healthy
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ../../secrets:/run/agentdance:ro
      - evidence:/evidence
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

  anchor-worker:
    build:
      context: ../..
    command: ["anchor-worker"]
    environment:
      <<: *runtime
      AGENTDANCE_DATABASE_URL: postgresql+psycopg://agentdance_anchor:anchor-only@postgres:5432/agentdance
      AGENTDANCE_RUNTIME_ROLE: anchor
    deploy:
      replicas: 2
    restart: on-failure
    depends_on:
      agentdance:
        condition: service_started
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    volumes:
      - ../../secrets:/run/agentdance:ro
      - evidence:/evidence
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]

volumes:
  postgres:
  minio:
  clamav:
  evidence:
