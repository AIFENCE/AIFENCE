# Durable writers run only in the active region: a standby points at a read
# replica, so rendering these there would fail on write or split-brain.
{{- if and .Values.lifecycleWorker.enabled (eq .Values.region.role "active") }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "aifence.fullname" . }}-lifecycle
  labels:
    {{- include "aifence.labels" . | nindent 4 }}
    app.kubernetes.io/component: lifecycle
spec:
  replicas: {{ .Values.lifecycleWorker.replicas }}
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels:
      {{- include "aifence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: lifecycle
  template:
    metadata:
      labels:
        {{- include "aifence.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: lifecycle
      annotations:
        checksum/lifecycle-secret-name: {{ .Values.lifecycleWorker.runtimeSecretName | sha256sum }}
        aifence.io/rollout-nonce: {{ .Values.rolloutNonce | quote }}
    spec:
      serviceAccountName: {{ include "aifence.lifecycleServiceAccountName" . }}
      automountServiceAccountToken: false
      terminationGracePeriodSeconds: 120
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: lifecycle
          image: {{ include "aifence.image" . | quote }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["lifecycle-worker"]
          env:
            - {name: AIFENCE_ENVIRONMENT, value: production}
            - {name: AIFENCE_RUNTIME_ROLE, value: lifecycle}
            - {name: AIFENCE_DATABASE_URL_FILE, value: /run/aifence/lifecycle/database-url}
            - {name: AIFENCE_AUTO_CREATE_SCHEMA, value: "false"}
            - {name: AIFENCE_DOCS_ENABLED, value: "false"}
            - name: AIFENCE_GUARD_INTERNAL_CIDRS
              value: {{ join "," (required "environment.internalCidrs is required" .Values.environment.internalCidrs) | quote }}
            - name: AIFENCE_GUARD_LIFECYCLE_BATCH_SIZE
              value: {{ .Values.lifecycleWorker.batchSize | quote }}
            - name: AIFENCE_GUARD_LIFECYCLE_POLL_MILLISECONDS
              value: {{ .Values.lifecycleWorker.pollMilliseconds | quote }}
            - name: AIFENCE_GUARD_LIFECYCLE_MAX_ATTEMPTS
              value: {{ .Values.lifecycleWorker.maxAttempts | quote }}
            - name: AIFENCE_GUARD_LIFECYCLE_LEASE_SECONDS
              value: {{ .Values.lifecycleWorker.leaseSeconds | quote }}
            - name: AIFENCE_GUARD_WORKER_CONCURRENCY
              value: {{ .Values.worker.concurrency | quote }}
            - name: AIFENCE_GUARD_ARTIFACT_STORE_BACKEND
              value: {{ .Values.environment.artifactStoreBackend | quote }}
            - name: AIFENCE_GUARD_ARTIFACT_S3_ENDPOINT
              value: {{ required "environment.artifactS3Endpoint is required" .Values.environment.artifactS3Endpoint | quote }}
            - name: AIFENCE_GUARD_ARTIFACT_S3_BUCKET
              value: {{ required "environment.artifactS3Bucket is required" .Values.environment.artifactS3Bucket | quote }}
            - name: AIFENCE_GUARD_ARTIFACT_S3_REGION
              value: {{ .Values.environment.artifactS3Region | quote }}
            - name: AIFENCE_GUARD_ARTIFACT_S3_PREFIX
              value: {{ .Values.environment.artifactS3Prefix | quote }}
            - name: AIFENCE_GUARD_ARTIFACT_S3_KMS_KEY_ID
              value: {{ required "environment.artifactS3KmsKeyId is required" .Values.environment.artifactS3KmsKeyId | quote }}
            - name: AIFENCE_GUARD_ARTIFACT_S3_OBJECT_LOCK_DAYS
              value: {{ .Values.environment.artifactS3ObjectLockDays | quote }}
            - {name: AIFENCE_GUARD_ARTIFACT_S3_DELETE_ENABLED, value: "true"}
            - name: AIFENCE_GUARD_KMS_BACKEND
              value: {{ .Values.environment.kmsBackend | quote }}
            - name: AIFENCE_GUARD_KMS_KEY_ID
              value: {{ .Values.environment.kmsKeyId | quote }}
            - name: AIFENCE_GUARD_TENANT_KEY_BACKEND
              value: {{ .Values.environment.tenantKeyBackend | quote }}
            - name: AIFENCE_GUARD_TENANT_KMS_KEY_TEMPLATE
              value: {{ required "environment.tenantKmsKeyTemplate is required" .Values.environment.tenantKmsKeyTemplate | quote }}
            - name: AIFENCE_GUARD_TENANT_KEY_DESTROY_ENABLED
              value: {{ .Values.environment.tenantKeyDestroyEnabled | quote }}
            - name: AIFENCE_GUARD_VAULT_ADDRESS
              value: {{ required "environment.vaultAddress is required" .Values.environment.vaultAddress | quote }}
            - {name: AIFENCE_GUARD_VAULT_TOKEN_FILE, value: /run/aifence/lifecycle/kms-vault-token}
            - name: AIFENCE_GUARD_VAULT_TRANSIT_MOUNT
              value: {{ .Values.environment.vaultTransitMount | quote }}
            - name: AIFENCE_GUARD_SIGNING_BACKEND
              value: {{ .Values.environment.signingBackend | quote }}
            - name: AIFENCE_GUARD_SIGNING_KEY_ID
              value: {{ .Values.environment.signingKeyId | quote }}
            - name: AIFENCE_GUARD_SIGNING_VAULT_ADDRESS
              value: {{ required "environment.signingVaultAddress is required" .Values.environment.signingVaultAddress | quote }}
            - {name: AIFENCE_GUARD_SIGNING_VAULT_TOKEN_FILE, value: /run/aifence/lifecycle/signing-vault-token}
            - name: AIFENCE_GUARD_SIGNING_VAULT_MOUNT
              value: {{ .Values.environment.signingVaultMount | quote }}
            - name: AIFENCE_GUARD_SIGNING_VAULT_KEY_NAME
              value: {{ .Values.environment.signingVaultKeyName | quote }}
            - name: AIFENCE_GUARD_EGRESS_PROXY_URL
              value: {{ required "environment.egressProxyUrl is required" .Values.environment.egressProxyUrl | quote }}
            - name: AIFENCE_GUARD_AUDIT_RETENTION_DAYS
              value: {{ .Values.environment.auditRetentionDays | quote }}
            - name: AIFENCE_GUARD_ARTIFACT_RETENTION_DAYS
              value: {{ .Values.environment.artifactRetentionDays | quote }}
            - name: AIFENCE_OTEL_EXPORTER_OTLP_ENDPOINT
              value: {{ .Values.environment.otlpEndpoint | quote }}
          volumeMounts:
            - {name: runtime, mountPath: /run/aifence/lifecycle, readOnly: true}
            - {name: tmp, mountPath: /tmp}
          resources:
            {{- toYaml .Values.lifecycleWorker.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: {drop: ["ALL"]}
      volumes:
        - name: runtime
          secret:
            secretName: {{ required "lifecycleWorker.runtimeSecretName is required" .Values.lifecycleWorker.runtimeSecretName }}
            defaultMode: 0400
        - name: tmp
          emptyDir: {medium: Memory, sizeLimit: 256Mi}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
