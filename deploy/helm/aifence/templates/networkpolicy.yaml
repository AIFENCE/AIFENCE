apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aifence.fullname" . }}-migration
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-10"
    helm.sh/hook-delete-policy: before-hook-creation
  labels:
    {{- include "aifence.labels" . | nindent 4 }}
    app.kubernetes.io/component: migration
spec:
  podSelector:
    matchLabels:
      {{- include "aifence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: migration
  policyTypes: ["Ingress", "Egress"]
  ingress: []
  egress:
    {{- include "aifence.dnsEgress" . | nindent 4 }}
    {{- include "aifence.databaseEgress" . | nindent 4 }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "aifence.fullname" . }}-clamav
  labels:
    {{- include "aifence.labels" . | nindent 4 }}
    app.kubernetes.io/component: malware-scanner
spec:
  podSelector:
    matchLabels:
      {{- include "aifence.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: malware-scanner
  policyTypes: ["Ingress", "Egress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "aifence.selectorLabels" . | nindent 14 }}
              app.kubernetes.io/component: control-plane
      ports:
        - protocol: TCP
          port: {{ .Values.clamav.servicePort }}
  egress:
    {{- include "aifence.dnsEgress" . | nindent 4 }}
    {{- range .Values.networkPolicy.clamavUpdateCIDRs }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    {{- end }}
{{- end }}
