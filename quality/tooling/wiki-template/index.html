<!doctype html>
<html lang="en" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="BizIQ documentation — source-driven production quality and control system for AI-generated artifacts and operational work.">
  <meta name="theme-color" content="#0b1020">
  <title>BizIQ Wiki</title>
  <link rel="stylesheet" href="./assets/styles.css">
</head>
<body>
  <a class="skip-link" href="#content">Skip to content</a>
  <div class="app-shell">
    <header class="topbar">
      <div class="topbar-left">
        <button class="icon-button mobile-only" id="menuButton" type="button" aria-label="Open navigation" aria-controls="sidebar" aria-expanded="false">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h16"/></svg>
        </button>
        <a class="brand" href="#/overview" aria-label="BizIQ Wiki home">
          <span class="brand-mark" aria-hidden="true">BQ</span>
          <span class="brand-copy"><strong>BizIQ</strong><span>Wiki</span></span>
        </a>
        <span class="version-chip" id="versionChip">Core {{CORE_REVISION}}</span>
      </div>
      <div class="topbar-center">
        <button class="search-trigger" id="searchTrigger" type="button" aria-haspopup="dialog">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
          <span>Search documentation</span>
          <kbd>Ctrl K</kbd>
        </button>
      </div>
      <div class="topbar-actions">
        <button class="icon-button" id="themeButton" type="button" aria-label="Toggle color theme">
          <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.41M17.66 6.34l1.41-1.41"/></svg>
        </button>
        <a class="icon-button" id="githubButton" href="https://github.com/NeuralBinary/BizIQ" target="_blank" rel="noreferrer" aria-label="Open BizIQ on GitHub">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.58 2 12.22c0 4.51 2.87 8.34 6.84 9.69.5.1.68-.22.68-.49v-1.9c-2.78.62-3.37-1.21-3.37-1.21-.45-1.18-1.11-1.49-1.11-1.49-.91-.64.07-.63.07-.63 1 .07 1.53 1.06 1.53 1.06.9 1.56 2.35 1.11 2.92.85.09-.66.35-1.11.64-1.37-2.22-.26-4.56-1.14-4.56-5.06 0-1.12.39-2.03 1.03-2.75-.1-.26-.45-1.3.1-2.71 0 0 .84-.28 2.75 1.05A9.35 9.35 0 0 1 12 6.92a9.3 9.3 0 0 1 2.5.35c1.91-1.33 2.75-1.05 2.75-1.05.55 1.41.2 2.45.1 2.71.64.72 1.03 1.63 1.03 2.75 0 3.93-2.34 4.79-4.57 5.05.36.32.68.94.68 1.9v2.79c0 .27.18.59.69.49A10.24 10.24 0 0 0 22 12.22C22 6.58 17.52 2 12 2Z"/></svg>
        </a>
      </div>
    </header>

    <aside class="sidebar" id="sidebar" aria-label="Documentation navigation">
      <div class="sidebar-scroll">
        <nav id="primaryNav"></nav>
        <div class="sidebar-footer">
          <div class="integrity-card">
            <span class="status-dot" aria-hidden="true"></span>
            <div><strong>Source-driven</strong><span id="integrityLabel">Generated from canonical BizIQ source</span></div>
          </div>
        </div>
      </div>
    </aside>
    <div class="sidebar-scrim" id="sidebarScrim" hidden></div>

    <main class="content-shell" id="content" tabindex="-1">
      <div class="content-column">
        <div class="breadcrumbs" id="breadcrumbs" aria-label="Breadcrumb"></div>
        <article class="article" id="article" aria-live="polite">
          <div class="loading-state"><span class="spinner"></span><span>Loading documentation…</span></div>
        </article>
        <nav class="page-nav" id="pageNav" aria-label="Previous and next pages"></nav>
        <footer class="site-footer">
          <span>Generated from canonical BizIQ source.</span>
          <span id="footerVersion">Runtime {{RUNTIME_VERSION}} · Core {{CORE_REVISION}}</span>
        </footer>
      </div>
      <aside class="toc" id="toc" aria-label="On this page"></aside>
    </main>
  </div>

  <dialog class="search-dialog" id="searchDialog" aria-labelledby="searchTitle">
    <div class="search-panel">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
        <label class="sr-only" for="searchInput" id="searchTitle">Search BizIQ documentation</label>
        <input id="searchInput" type="search" autocomplete="off" placeholder="Search docs, controls, contracts, operations…">
        <kbd>Esc</kbd>
      </div>
      <div class="search-results" id="searchResults"></div>
      <div class="search-hint"><span>↑↓ Navigate</span><span>Enter Open</span><span>Esc Close</span></div>
    </div>
  </dialog>

  <script type="module" src="./assets/app.js"></script>
</body>
</html>
