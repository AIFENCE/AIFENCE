# AIFENCE — single composed stack: PostgreSQL + the unified control plane.
# The one aifence-api process serves core + guard (/guard) + bus (/bus) +
# quality (/v1/quality) + the fence flow (/v1/fence).
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: aifence
      POSTGRES_PASSWORD: ${AIFENCE_POSTGRES_PASSWORD:-devpassword}
      POSTGRES_DB: aifence
    volumes:
      - aifence-pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aifence"]
      interval: 5s
      timeout: 5s
      retries: 10

  aifence:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      AIFENCE_ENVIRONMENT: development
      AIFENCE_DATABASE_URL: postgresql+psycopg://aifence:${AIFENCE_POSTGRES_PASSWORD:-devpassword}@postgres:5432/aifence
      AIFENCE_AUTO_CREATE_SCHEMA: "true"
      AIFENCE_DOCS_ENABLED: "true"
    ports:
      - "8080:8080"
    command: ["aifence-api"]

volumes:
  aifence-pg:
