# AIFENCE — single Alembic configuration for the merged schema.
# One migration history builds every subsystem's tables (bus + guard + quality)
# because they all declare models against aifence.core.db.Base.
[alembic]
script_location = alembic
prepend_sys_path = src
path_separator = os
# The database URL is read from the environment at runtime (see alembic/env.py):
# AIFENCE_DATABASE_URL, falling back to the CoreSettings default.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
